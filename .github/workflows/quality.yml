name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite for Electron
        run: npm run rebuild:native

      - name: Static checks and unit tests
        run: npm run check

      - name: Electron E2E
        run: xvfb-run --auto-servernum npm run test:e2e

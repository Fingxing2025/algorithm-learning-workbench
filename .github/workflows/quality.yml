name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build

  electron-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm run test:e2e

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
            artifact: macos
          - os: windows-latest
            command: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: algorithm-workbench-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

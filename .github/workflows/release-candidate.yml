name: release-candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview strips credentials; signed fails closed without platform secrets.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - signed

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build

  macos-candidate:
    needs: source-gates
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - name: Prepare Apple API key file
        if: inputs.mode == 'signed'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          openssl base64 -d -A -in <(printf '%s' "$APPLE_API_KEY_BASE64") -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm run release:mac:${{ inputs.mode }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      - name: Packaged smoke with clean and existing V2 userData
        run: node ./node_modules/@playwright/test/cli.js test tests/e2e/packaged.spec.ts
        env:
          PACKAGED_APP_PATH: release/mac-arm64/算法学习工作台.app/Contents/MacOS/算法学习工作台
      - name: Export application version
        run: echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: algorithm-workbench-${{ inputs.mode }}-mac-arm64
          path: |
            release/*-${{ env.APP_VERSION }}-mac-arm64.*
            release/candidates/${{ env.APP_VERSION }}-mac-arm64-${{ inputs.mode }}/**
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Apple API key
        if: always() && inputs.mode == 'signed'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  windows-candidate:
    needs: source-gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm run release:win:${{ inputs.mode }}
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      - name: Packaged smoke with clean and existing V2 userData
        run: node ./node_modules/@playwright/test/cli.js test tests/e2e/packaged.spec.ts
        env:
          PACKAGED_APP_PATH: release/win-unpacked/算法学习工作台.exe
      - name: Export application version
        shell: bash
        run: echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: algorithm-workbench-${{ inputs.mode }}-win-x64
          path: |
            release/*-${{ env.APP_VERSION }}-win-x64.*
            release/candidates/${{ env.APP_VERSION }}-win-x64-${{ inputs.mode }}/**
          if-no-files-found: error
          retention-days: 14

  evidence-boundary:
    needs: [macos-candidate, windows-candidate]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Candidate build and packaged smoke completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Windows CI is not real-machine NSIS install, upgrade, permission, or uninstall acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Only signed mode with successful platform verification may be considered for formal distribution." >> "$GITHUB_STEP_SUMMARY"
